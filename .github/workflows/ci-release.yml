name: Build and Release WinForms App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Triggers release creation on tags like v1.0.0
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to match your .NET version (e.g., 8.0.x, 9.0.x)

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Debug (CI Test)
      run: dotnet build --configuration Debug --no-restore

    - name: Run Tests
      run: dotnet test --no-build --verbosity normal
      continue-on-error: true # Prevents pipeline failure if test project is missing

    - name: Publish Release Executable
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push'
      run: >
        dotnet publish
        --configuration Release
        --output ./publish
        -p:PublishSingleFile=true
        -p:SelfContained=false
        -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Create Release Zip
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: Compress-Archive -Path ./publish/* -DestinationPath ./WinFormsApp-Release.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./WinFormsApp-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
