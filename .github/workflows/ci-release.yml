name: Build and Release WinForms App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Triggers automatic release build on version tags (e.g. v1.0.0)
  pull_request:
    branches: [ "main", "master" ]
    
permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Set this to your app's .NET version (e.g. 8.0.x, 9.0.x)

    - name: GitVersion
      id: gitversion
      uses: gittools/actions/gitversion@v5
      with:
        useConfigFile: true

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Debug (CI Check)
      run: dotnet build --configuration Debug --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }} -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Publish Release Executable
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push'
      run: >
        dotnet publish ./InventoryPOS.csproj
        --configuration Release
        --output ./publish
        -p:PublishSingleFile=true
        -p:SelfContained=false
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:Version=${{ steps.gitversion.outputs.semVer }}
        -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
        -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Compress Release Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: Compress-Archive -Path ./publish/* -DestinationPath ./WinFormsApp-Release.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./WinFormsApp-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
