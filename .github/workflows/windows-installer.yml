name: Build Windows Installer

on:
  release:
    types: [ "published" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build and publish (win-x64)
      run: |
        dotnet publish -c Release -r win-x64 -o ./publish /p:PublishSingleFile=true /p:SelfContained=false

    - name: Package publish folder (zip)
      run: |
        $zip = "publish.zip"
        if (Test-Path $zip) { Remove-Item $zip -Force }
        Compress-Archive -Path ./publish/* -DestinationPath $zip

    - name: Upload publish artifact (workflow)
      uses: actions/upload-artifact@v4
      with:
        name: publish-zip
        path: publish.zip

    - name: Compile Installer with Inno Setup (if script present)
      shell: pwsh
      run: |
        $iss = "installer-script.iss"
        if (Test-Path $iss) {
          Write-Host "Found $iss, compiling installer with Inno Setup..."
          # ISCC.exe is typically at this path on windows-latest runners if Inno Setup available
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
        } else {
          Write-Host "$iss not found in repo; skipping Inno Setup step."
        }

    # If this workflow run was triggered by a release, attach installer exe(s) to the release.
    # This step uses the gh CLI to upload any .exe files found in ./Output. If you prefer not to use gh,
    # replace this with a different upload method (or ensure the Inno Setup script writes to a known path
    # and use actions/upload-release-asset@v2 for a single file).
    - name: Upload any found installers as release assets
      if: ${{ github.event_name == 'release' }}
      shell: pwsh
      run: |
        Write-Host "Searching ./Output for .exe files to upload to release $($env:GITHUB_REF)"
        $files = Get-ChildItem -Path ./Output -Filter *.exe -File -ErrorAction SilentlyContinue
        if ($files) {
          # Ensure gh CLI exists; if not, attempt to install via winget (may be available on windows-latest)
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            Write-Host "gh CLI not found; attempting to install via winget..."
            winget install --id GitHub.cli -e --accept-package-agreements --accept-source-agreements
          }
          foreach ($f in $files) {
            Write-Host "Uploading $($f.FullName) to release $($env:GITHUB_REF_NAME)..."
            gh release upload $env:GITHUB_REF_NAME $f.FullName --clobber
          }
        } else {
          Write-Host "No .exe files found in ./Output to upload to the release."
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
